services:
    app:
        build:
            context: .
            args:
                USER_ID: '${USER_ID:-1000}'
                GROUP_ID: '${GROUP_ID:-1000}'
                NODE_VERSION: '${NODE_VERSION:-24}'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${APP_PORT:-8081}:8080'
            - '${VITE_PORT:-5181}:${VITE_PORT:-5181}'
        environment:
            HEALTHCHECK_PATH: '/up'
            PHP_OPCACHE_ENABLE: '0'
            SSL_MODE: 'off'
            AUTORUN_ENABLED: 'false'
            XDEBUG_MODE: '${XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${XDEBUG_CONFIG:-client_host=host.docker.internal}'
            PLAYWRIGHT_BROWSERS_PATH: '0'
            PUPPETEER_CACHE_DIR: '/var/www/html/node_modules/.cache/puppeteer'
            CRITICAL_URL: 'http://localhost:8080'
            DISPLAY: ':0'
        volumes:
            - '.:/var/www/html'
            - '/tmp/.X11-unix:/tmp/.X11-unix:rw'
        depends_on:
            - redis
            - mysql
            - mailpit
    mysql:
        image: 'mysql/mysql-server:8.0'
        ports:
            - '${FORWARD_DB_PORT:-3381}:3306'
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD:-password}'
            MYSQL_ROOT_HOST: '%'
            MYSQL_DATABASE: '${DB_DATABASE:-laravel}'
            MYSQL_USER: '${DB_USERNAME:-laravel}'
            MYSQL_PASSWORD: '${DB_PASSWORD:-password}'
            MYSQL_ALLOW_EMPTY_PASSWORD: 1
            MYSQL_EXTRA_OPTIONS: '${MYSQL_EXTRA_OPTIONS:-}'
        volumes:
            - 'sail-mysql:/var/lib/mysql'
            - './docker/mysql/create-testing-database.sh:/docker-entrypoint-initdb.d/10-create-testing-database.sh'
        healthcheck:
            test:
                - CMD
                - mysqladmin
                - ping
                - '-h'
                - '127.0.0.1'
                - '-p${DB_PASSWORD:-password}'
            retries: 3
            timeout: 5s
    redis:
        image: 'redis:alpine'
        ports:
            - '${FORWARD_REDIS_PORT:-6381}:6379'
        volumes:
            - 'sail-redis:/data'
        healthcheck:
            test:
                - CMD
                - redis-cli
                - ping
            retries: 3
            timeout: 5s
    mailpit:
        image: 'axllent/mailpit:latest'
        ports:
            - '${FORWARD_MAILPIT_PORT:-1081}:1025'
            - '${FORWARD_MAILPIT_DASHBOARD_PORT:-8181}:8025'
volumes:
    sail-mysql:
        driver: local
    sail-redis:
        driver: local
