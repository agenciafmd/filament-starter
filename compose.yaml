x-build: &build
    context: .
    dockerfile: .docker/runtime/8.5/Dockerfile
    target: development
    args:
        USER_ID: '${USER_ID:-1000}'
        GROUP_ID: '${GROUP_ID:-1000}'
        NODE_VERSION: '${NODE_VERSION:-24}'

services:
    app:
        image: '${COMPOSE_PROJECT_NAME}-app:local'
        build: *build
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${APP_PORT:-8081}:8080'
            - '${VITE_PORT:-5181}:${VITE_PORT:-5181}'
        environment:
            XDEBUG_MODE: '${XDEBUG_MODE:-off}'
            DISPLAY: ':0'
        volumes:
            - '.:/var/www/html'
            - '/tmp/.X11-unix:/tmp/.X11-unix:rw'
        depends_on:
            redis:
                condition: service_healthy
            mysql:
                condition: service_healthy
    queue:
        image: '${COMPOSE_PROJECT_NAME}-queue:local'
        build: *build
        command: ['php', '/var/www/html/artisan', 'queue:listen', '--tries=3', '--delay=5', '--timeout=60', '--queue=high,default,low']
        stop_signal: SIGTERM
        restart: unless-stopped
        healthcheck:
            test: ['CMD', 'pgrep', '-f', 'queue:listen']
            start_period: 10s
        volumes:
            - '.:/var/www/html'
        depends_on:
            redis:
                condition: service_healthy
            mysql:
                condition: service_healthy
    scheduler:
        image: '${COMPOSE_PROJECT_NAME}-scheduler:local'
        build: *build
        command: ['php', '/var/www/html/artisan', 'schedule:work']
        stop_signal: SIGTERM
        restart: unless-stopped
        healthcheck:
            test: ['CMD', 'healthcheck-schedule']
            start_period: 10s
        volumes:
            - '.:/var/www/html'
        depends_on:
            redis:
                condition: service_healthy
            mysql:
                condition: service_healthy
    mysql:
        image: 'mysql:8.4'
        restart: unless-stopped
        ports:
            - '${FORWARD_DB_PORT:-3381}:3306'
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD:-password}'
            MYSQL_ROOT_HOST: '%'
            MYSQL_DATABASE: '${DB_DATABASE:-laravel}'
            MYSQL_USER: '${DB_USERNAME:-laravel}'
            MYSQL_PASSWORD: '${DB_PASSWORD:-password}'
        volumes:
            - 'mysql-data:/var/lib/mysql'
            - './.docker/database/mysql/create-testing-database.sh:/docker-entrypoint-initdb.d/10-create-testing-database.sh'
        healthcheck:
            test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-p${DB_PASSWORD:-password}']
            retries: 3
            timeout: 5s
    redis:
        image: 'valkey/valkey:8-alpine'
        restart: unless-stopped
        ports:
            - '${FORWARD_REDIS_PORT:-6381}:6379'
        volumes:
            - 'valkey-data:/data'
        healthcheck:
            test: ['CMD', 'valkey-cli', 'ping']
            retries: 3
            timeout: 5s
    mailpit:
        image: 'axllent/mailpit:latest'
        ports:
            - '${FORWARD_MAILPIT_PORT:-1081}:1025'
            - '${FORWARD_MAILPIT_DASHBOARD_PORT:-8181}:8025'
volumes:
    mysql-data:
        driver: local
    valkey-data:
        driver: local
