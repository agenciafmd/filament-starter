; Diretivas do PHP próprias da aplicação, lidas depois das da imagem serversideup.
;
; Antes de adicionar uma diretiva aqui, veja se a imagem já tem uma variável de ambiente
; para ela (PHP_MEMORY_LIMIT, PHP_UPLOAD_MAX_FILE_SIZE etc.). A variável pode ser ajustada
; por ambiente, sem rebuild:
; https://serversideup.net/open-source/docker-php/docs/reference/environment-variable-specification
;
; Exemplo:
; max_input_nesting_level = 128
