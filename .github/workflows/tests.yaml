name: tests

on:
    push:
        branches:
            - master
    pull_request:
        branches:
            - master

jobs:
    ci:
        runs-on: ubuntu-latest

        services:
            mysql:
                image: mysql:8.4
                env:
                    MYSQL_ROOT_PASSWORD: password
                    MYSQL_DATABASE: testing
                ports:
                    - 3306:3306
                options: >-
                    --health-cmd="mysqladmin ping -h 127.0.0.1 -ppassword"
                    --health-interval=10s
                    --health-timeout=5s
                    --health-retries=5

        env:
            DB_CONNECTION: mysql
            DB_HOST: 127.0.0.1
            DB_PORT: 3306
            DB_USERNAME: root
            DB_PASSWORD: password

        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  # o Pest roda com --tia, que compara com o histórico da master
                  fetch-depth: 0

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: 8.5
                  extensions: intl, imagick, bcmath, sockets, pdo_mysql
                  ini-values: date.timezone=America/Sao_Paulo
                  tools: composer:v2
                  coverage: pcov

            - name: Setup Node
              uses: actions/setup-node@v7
              with:
                  node-version: '24'
                  cache: npm

            - name: Copy Environment File
              run: cp .env.example .env

            - name: Install Dependencies
              run: composer install --no-interaction --prefer-dist --optimize-autoloader

            - name: Generate Application Key
              run: php artisan key:generate

            - name: Cache Playwright Browsers
              uses: actions/cache@v6
              with:
                  path: ~/.cache/ms-playwright
                  key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

            # o postinstall do package.json baixa o chromium, quando ele não vem do cache
            - name: Install Node Dependencies
              run: npm ci

            - name: Install Playwright System Dependencies
              run: npx playwright install-deps chromium

            - name: Build Assets
              run: npm run build

            - name: Rector Cache
              uses: actions/cache@v6
              with:
                  path: /tmp/rector
                  key: ${{ runner.os }}-rector-${{ hashFiles('composer.lock') }}
                  restore-keys: ${{ runner.os }}-rector-

            - name: PHPStan Cache
              uses: actions/cache@v6
              with:
                  path: /tmp/phpstan
                  key: ${{ runner.os }}-phpstan-${{ hashFiles('composer.lock') }}
                  restore-keys: ${{ runner.os }}-phpstan-

            - name: Create Cache Directories
              run: mkdir -p /tmp/rector /tmp/phpstan

            - name: Tests
              run: composer test

            - name: Store Artifacts
              if: failure()
              uses: actions/upload-artifact@v7
              with:
                  name: browser-screenshots
                  path: tests/Browser/Screenshots
                  if-no-files-found: ignore
