services:
    app:
        build:
            context: .
            dockerfile: .docker/runtime/8.5/Dockerfile
            target: production
        env_file:
            -   path: .env
                required: true
        environment: !override
            APP_ENV: production
            APP_DEBUG: 'false'
        ports: !override
            - '${APP_PORT:-8081}:8080'
        volumes: !reset [ ]
    queue:
        build:
            context: .
            dockerfile: .docker/runtime/8.5/Dockerfile
            target: production
        command: !override ['php', '/var/www/html/artisan', 'queue:work', '--tries=3', '--delay=5', '--timeout=60', '--queue=high,default,low']
        healthcheck:
            test: !override ['CMD', 'healthcheck-queue']
        env_file:
            -   path: .env
                required: true
        environment: !override
            APP_ENV: production
            APP_DEBUG: 'false'
            AUTORUN_ENABLED: 'false'
        volumes: !reset [ ]
    scheduler:
        build:
            context: .
            dockerfile: .docker/runtime/8.5/Dockerfile
            target: production
        env_file:
            -   path: .env
                required: true
        environment: !override
            APP_ENV: production
            APP_DEBUG: 'false'
            AUTORUN_ENABLED: 'false'
        volumes: !reset [ ]
